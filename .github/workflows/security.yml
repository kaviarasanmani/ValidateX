name: Security Scanning

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  dependency-and-sast-audit:
    name: Dependency & SAST Audit (pip-audit + Bandit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install package and security scanners
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install pip-audit bandit[toml]
          pip install -e ".[dev,database,polars]"
          python -m pip install --upgrade pip setuptools wheel

      - name: Run Bandit SAST scan on validatex/
        run: bandit -r validatex/ -ll -ii

      - name: Run pip-audit dependency vulnerability scan
        run: pip-audit --skip-editable --desc on

      - name: Run ValidateX security unit tests
        run: python -m pytest tests/unit/test_security.py -v

  secret-scanning:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks secret scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
